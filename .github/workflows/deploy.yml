name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Base-URL bestimmen
        id: base
        # Projekt-Seite: https://<user>.github.io/<repo>/  →  Base = /<repo>/
        # User-Seite (Repo heißt <user>.github.io)        →  Base = /
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then base="/"; else base="/${repo}/"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Base-URL: $base"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Unit-Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Nur öffentliche Werte: Projekt-URL und anon (public) Key – niemals den service_role Key!
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE: ${{ steps.base.outputs.base }}

      - name: Prüfen, ob die Base-URL im Build steckt
        run: |
          base="${{ steps.base.outputs.base }}"
          grep -q "src=\"${base}assets/" dist/index.html || { echo "Base-URL ${base} fehlt in dist/index.html"; cat dist/index.html; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
